name: Package Xray Console Client

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Run unit tests
        run: dotnet test tests/XrayConsoleClient.Tests/XrayConsoleClient.Tests.csproj --configuration Release

      - name: Pack NuGet tool
        env:
          PACKAGE_VERSION: ${{ github.ref_name }}
        run: |
          version="${PACKAGE_VERSION#v}"
          dotnet pack src/XrayConsoleClient/XrayConsoleClient.csproj \
            --configuration Release \
            --output package \
            -p:PackageVersion="$version"

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dotnet nuget add source \
            --username "$GITHUB_ACTOR" \
            --password "$GITHUB_TOKEN" \
            --store-password-in-clear-text \
            --name github \
            https://nuget.pkg.github.com/mmarca-tech/index.json
          dotnet nuget push package/*.nupkg \
            --api-key "$GITHUB_TOKEN" \
            --source github \
            --skip-duplicate

      - name: Publish Linux package
        run: dotnet publish src/XrayConsoleClient/XrayConsoleClient.csproj --configuration Release --runtime linux-x64 --self-contained true -p:PublishSingleFile=true --output publish

      - name: Archive package
        run: tar -czf xray-console-client-linux-x64.tar.gz -C publish .

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" xray-console-client-linux-x64.tar.gz --clobber